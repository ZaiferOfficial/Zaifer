    position:absolute;
    top:50%;
    left:50%;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:translate(-50%,-50%);
    filter:saturate(1.2) contrast(1.12) brightness(0.88);
  }
  .bg-flower{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:clamp(280px, 34vw, 440px);
    height:auto;
    z-index:1;
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:0.95;
  }
  @media (max-width:480px){
    .bg-flower{ width:clamp(240px, 70vw, 360px); }
  }

  .bg-vignette{
    position:absolute;
    inset:0;
    background:
      radial-gradient(ellipse at center, rgba(5,3,3,0.12) 0%, rgba(5,3,3,0.22) 55%, rgba(5,3,3,0.5) 100%),
      linear-gradient(180deg, rgba(5,3,3,0.3) 0%, rgba(5,3,3,0.02) 22%, rgba(5,3,3,0.02) 78%, rgba(5,3,3,0.4) 100%);
  }
  .bg-tint{
    position:absolute;
    inset:0;
    background:rgba(140,15,20,0.12);
    mix-blend-mode:multiply;
  }

  /* primera capa de "clcik para entrar" */
  #entry{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050303;
    cursor:pointer;
    transition:opacity .7s ease;
  }
  #entry.hide{
    opacity:0;
    pointer-events:none;
  }
  .entry-inner{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }
  .entry-glow{
    position:absolute;
    width:220px;
    height:220px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(224,33,40,0.55) 0%, rgba(224,33,40,0.12) 45%, rgba(224,33,40,0) 70%);
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(0.92); opacity:0.75; }
    50%{ transform:scale(1.12); opacity:1; }
  }
  .entry-text{
    position:relative;
    margin-top:36px;
    font-size:27px;
    letter-spacing:0.02em;
    color:#ffffff;
    opacity:1;
    font-weight:400;
    text-shadow:none;
    font-family:'Noto Sans Math','Cambria Math','STIX Two Math','Apple Symbols','Segoe UI Symbol','Noto Sans Symbols 2','DejaVu Sans',serif;
  }

  /* perfil del papucho Zaifer */
  #stage{
    position:relative;
    z-index:10;
    height:100%;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .9s ease, transform .9s ease;
  }
  #stage.show{
    opacity:1;
    transform:translateY(0);
  }

  .card{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:0 24px;
  }

  .avatar-ring{
    position:relative;
    width:220px;
    height:220px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:90px;
  }
  .avatar-ring::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--red-deep), var(--red-bright), var(--red-deep), var(--red-bright), var(--red-deep));
    filter:blur(9px);
    opacity:0.8;
    animation:spin 7s linear infinite;
    transition:opacity .3s ease, filter .3s ease;
  }
  .avatar-ring:hover::before{
    opacity:1;
    filter:blur(13px) brightness(1.35);
  }
  .drips{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:6;
  }
  .thread{
    position:absolute;
    left:var(--x);
    bottom:6px;
    width:2px;
    height:0;
    background:linear-gradient(to bottom, rgba(216,20,26,0) 0%, rgba(224,28,32,0.92) 45%, rgba(120,6,10,0.95) 100%);
    transform:translateX(-50%);
    border-radius:2px;
    opacity:0;
  }
  .avatar-ring.dripping .thread{
    animation:threadGrow var(--dur,1.7s) ease-in var(--delay,0s) both;
  }
  @keyframes threadGrow{
    0%{ height:0; opacity:0; }
    9%{ opacity:.95; }
    52%{ height:var(--th,26px); opacity:.95; }
    70%{ height:calc(var(--th,26px) * 0.35); opacity:.7; }
    84%{ height:0; opacity:0; }
    100%{ height:0; opacity:0; }
  }
  .drip{
    position:absolute;
    left:var(--x);
    bottom:6px;
    width:15px;
    height:19px;
    clip-path:path("M7.5 0.6C7.5 0.6 15 8.8 15 12.7C15 16.9 11.7 19 7.5 19C3.3 19 0 16.9 0 12.7C0 8.8 7.5 0.6 7.5 0.6Z");
    background:radial-gradient(circle at 34% 30%, #7c1015 0%, #5e0b0f 34%, #40060a 64%, #220305 100%);
    box-shadow:0 0 7px 1px rgba(120,10,14,0.4), inset -2px -3px 5px rgba(0,0,0,0.55), inset 1px 1px 2px rgba(110,15,18,0.3);
    opacity:0;
    --wf:1;
    --hf:1;
    transform:translate(-50%, 0) scale(calc(var(--s,1) * var(--wf) * 0.15), calc(var(--s,1) * var(--hf) * 0.15));
  }
  .avatar-ring.dripping .drip{
    animation:dripFall var(--dur,1.7s) ease-in var(--delay,0s) both;
  }
  @keyframes dripFall{
    0%{ transform:translate(-50%, 0) scale(calc(var(--s,1) * var(--wf) * 0.15), calc(var(--s,1) * var(--hf) * 0.15)); opacity:0; }
    12%{ transform:translate(-50%, 2px) scale(calc(var(--s,1) * var(--wf) * 1.12), calc(var(--s,1) * var(--hf) * 1.12)); opacity:1; }
    22%{ transform:translate(-50%, 5px) scale(calc(var(--s,1) * var(--wf)), calc(var(--s,1) * var(--hf))); opacity:1; }
    85%{ transform:translate(-50%, 130px) scale(calc(var(--s,1) * var(--wf) * 0.9), calc(var(--s,1) * var(--hf) * 0.9)); opacity:1; }
    100%{ transform:translate(-50%, 144px) scale(calc(var(--s,1) * var(--wf) * 0.62), calc(var(--s,1) * var(--hf) * 0.62)); opacity:0; }
  }
  @keyframes spin{
    to{ transform:rotate(360deg); }
  }
  .avatar-ring .avatar-photo{
    position:relative;
    width:200px;
    height:200px;
    border-radius:50%;
    object-fit:cover;
    object-position:center 18%;
    border:3px solid #0a0605;
    box-shadow:0 0 0 1px rgba(224,33,40,0.5), 0 10px 40px rgba(0,0,0,0.6);
    transition:box-shadow .3s ease;
    z-index:1;
  }
  .avatar-ring:hover .avatar-photo{
    box-shadow:0 0 0 2px rgba(224,33,40,0.9), 0 0 30px 6px rgba(224,33,40,0.5), 0 10px 40px rgba(0,0,0,0.6);
  }
  .photo-frame{
    position:absolute;
    top:50%;
    left:50%;
    width:300px;
    height:300px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:2;
  }

  .name-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .name-wrap::before{
    content:"";
    position:absolute;
    top:-6px;
    left:50%;
    width:22px;
    height:22px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,60,50,0.95), rgba(255,20,20,0) 72%);
    transform:translate(-50%, -50%) scale(0);
    opacity:0;
    pointer-events:none;
    z-index:2;
  }
  .avatar-ring.dripping ~ .name-wrap::before{
    animation:dripSplash 0.5s ease-out 1.78s;
  }
  @keyframes dripSplash{
    0%{ transform:translate(-50%, -50%) scale(0.2); opacity:0.9; }
    40%{ transform:translate(-50%, -50%) scale(1.6); opacity:0.8; }
    100%{ transform:translate(-50%, -50%) scale(2.6); opacity:0; }
  }
  .name-frame{
    position:absolute;
    top:50%;
    left:50%;
    width:420px;
    transform:translate(-50%, -54.8%);
    pointer-events:none;
    z-index:0;
    opacity:0.85;
  }

  .name{
    position:relative;
    z-index:1;
    font-size:78px;
    line-height:1;
    letter-spacing:0.01em;
    color:var(--ash);
    text-shadow:0 0 26px rgba(176,20,28,0.65), 0 2px 14px rgba(0,0,0,0.85);
    transition:color 1.2s ease, text-shadow 1.2s ease;
  }
  @keyframes nameFlash{
    0%{ color:var(--ash); text-shadow:0 0 26px rgba(176,20,28,0.65), 0 2px 14px rgba(0,0,0,0.85); }
    8%{ color:#ff2b2b; text-shadow:0 0 20px #ff2b2b, 0 0 55px rgba(255,20,30,0.95), 0 0 95px rgba(255,20,30,0.7), 0 2px 14px rgba(0,0,0,0.85); }
    74%{ color:#ff2b2b; text-shadow:0 0 20px #ff2b2b, 0 0 55px rgba(255,20,30,0.95), 0 0 95px rgba(255,20,30,0.7), 0 2px 14px rgba(0,0,0,0.85); }
    100%{ color:var(--red-bright); text-shadow:0 0 20px rgba(224,33,40,0.9), 0 0 45px rgba(224,33,40,0.55), 0 2px 14px rgba(0,0,0,0.85); }
  }
  .name-wrap .name.ignited{
    color:var(--red-bright);
    text-shadow:0 0 20px rgba(224,33,40,0.9), 0 0 45px rgba(224,33,40,0.55), 0 2px 14px rgba(0,0,0,0.85);
  }
  .avatar-ring.dripping ~ .name-wrap .name{
    animation:nameFlash 1.9s ease-out 1.78s;
  }

  .links{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    width:460px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .links-group{
    display:flex;
    align-items:center;
    gap:29px;
  }
  .link-btn{
    position:relative;
    width:46px;
    height:46px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(20,12,12,0.55);
    border:none;
    color:var(--ash);
    text-decoration:none;
    transition:transform .2s ease, background .2s ease, box-shadow .2s ease, color .2s ease;
  }

    background-position:center;
    transform:translate(-50%, -50%);
    pointer-events:none;
    z-index:0;
  }
  .link-btn svg{
    position:relative;
    z-index:1;
    width:21px;
    height:21px;
    fill:currentColor;
  }
  .link-btn:hover,
  .link-btn:focus-visible{
    transform:translateY(-3px);
    background:rgba(30,14,14,0.8);
    box-shadow:0 8px 20px rgba(176,20,28,0.4);
    color:#fff;
    outline:none;
  }

  .uid{
    font-size:19px;
    letter-spacing:0.03em;
    color:var(--ash-dim);
    margin-bottom:34px;
    font-family:var(--font-display);
  }
  .uid b{ color:var(--red-bright); font-weight:400; }

  /* widget de la musiquita */
  #nowplaying{
    position:fixed;
    bottom:48px;
    left:22px;
    z-index:15;
    display:flex;
    flex-direction:column;
    gap:9px;
    width:290px;
    cursor:pointer;
    user-select:none;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .8s ease .3s, transform .8s ease .3s;
  }
  #nowplaying.show{
    opacity:1;
    transform:translateY(0);
  }
  #nowplaying:focus-visible{
    outline:2px solid var(--red-bright);
    outline-offset:5px;
    border-radius:8px;
  }

  .np-top{
    display:flex;
    align-items:center;
    gap:11px;
  }

  .np-art{
    position:relative;
    width:62px;
    height:62px;
    border-radius:12px;
    overflow:hidden;
    flex-shrink:0;
    box-shadow:0 0 0 1px rgba(224,33,40,0.55), 0 6px 18px rgba(0,0,0,0.75);
  }
  .np-art img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  #nowplaying.playing .np-art{
    animation:npPulse 1.7s ease-in-out infinite;
  }
  @keyframes npPulse{
    0%,100%{ box-shadow:0 0 0 1px rgba(224,33,40,0.55), 0 6px 18px rgba(0,0,0,0.75); }
    50%{ box-shadow:0 0 0 3px rgba(224,33,40,0.9), 0 0 16px 3px rgba(224,33,40,0.55); }
  }

  .np-info{
    display:flex;
    flex-direction:column;
    gap:1px;
  }
  .np-title{
    font-family:var(--font-display);
    font-size:25px;
    line-height:1.1;
    color:var(--ash);
    text-shadow:0 2px 10px rgba(0,0,0,0.9), 0 0 16px rgba(176,20,28,0.45);
  }
  .np-artist{
    font-family:var(--font-display);
    font-size:14px;
    color:var(--ash-dim);
    text-shadow:0 2px 8px rgba(0,0,0,0.9);
  }

  .np-viz{
    width:100%;
    height:64px;
    display:block;
    filter:drop-shadow(0 3px 8px rgba(0,0,0,0.55));
  }

  .steam-btn{
    position:fixed;
    bottom:44px;
    right:44px;
    z-index:15;
    width:76px;
    height:76px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(20,12,12,0.55);
    border:none;
    color:var(--ash);
    text-decoration:none;
    opacity:0;
    transform:translateY(10px);
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease, color .2s ease, opacity .8s ease .3s, transform .8s ease .3s;
  }
  .steam-btn.show{
    opacity:1;
    transform:translateY(0);
  }
  .steam-btn svg{
    position:relative;
    width:58px;
    height:58px;
    fill:currentColor;
    z-index:1;
  }
  .steam-frame{
    position:absolute;
    top:50%;
    left:50%;
    width:124px;
    height:auto;
    transform:translate(-49.9%,-35.3%);
    pointer-events:none;
    z-index:0;
  }
  .steam-btn:hover,
  .steam-btn:focus-visible{
    transform:translateY(-3px) scale(1.06);
    background:rgba(30,14,14,0.8);
    box-shadow:0 8px 20px rgba(176,20,28,0.4);
    color:#fff;
    outline:none;
  }
  .steam-btn.show:hover{
    transform:translateY(-3px) scale(1.06);
  }

  @media (prefers-reduced-motion: reduce){
    .entry-glow, #nowplaying.playing .np-art{ animation:none !important; }
  }

  @media (max-width:480px){
    .name{ font-size:54px; }
    .avatar-ring{ width:170px; height:170px; margin-bottom:70px; }
    .avatar-ring .avatar-photo{ width:150px; height:150px; }
    .photo-frame{ width:230px; height:230px; }
    .name-frame{ width:291px; }
    .links{ bottom:152px; width:280px; }
    .links-group{ gap:18px; }
    .link-btn{ width:34px; height:34px; }
    .link-btn::before{ width:50px; height:50px; }
    .link-btn svg{ width:16px; height:16px; }
    #nowplaying{ bottom:34px; left:14px; width:calc(100vw - 28px); max-width:300px; }
    .np-art{ width:50px; height:50px; }
    .np-title{ font-size:21px; }
    .np-artist{ font-size:12px; }
    .np-viz{ height:56px; }
    .steam-btn{ bottom:32px; right:32px; width:62px; height:62px; }
    .steam-btn svg{ width:47px; height:47px; }
    .steam-frame{ width:101px; }
  }
</style>
</head>

<script>
  const entry = document.getElementById('entry');
  const stage = document.getElementById('stage');
  const nowplaying = document.getElementById('nowplaying');
  const track = document.getElementById('track');
  const canvas = document.getElementById('npViz');
  const vizCtx = canvas.getContext('2d');

  const BAR_COUNT = 44;
  let audioCtx, analyser, dataArray, sourceNode, rafId;
  const barHeights = new Array(BAR_COUNT).fill(0);
  const barVel = new Array(BAR_COUNT).fill(0);
  const barJitter = new Array(BAR_COUNT).fill(0).map(()=> (Math.random()-0.5));
  const barCeil = new Array(BAR_COUNT).fill(0).map(()=> 0.45 + Math.random()*0.4);
  barCeil[0] = 0.4;   // 1ra: peke
  barCeil[1] = 0.62;  // 2da: intermedia
  barCeil[2] = 0.95;  // 3ra: palo grande
  /* movimiento de barras de la musiquita */
  const barPeak = new Array(BAR_COUNT).fill(60);
  const spikeBoost = new Array(BAR_COUNT).fill(0);
  const SPRING_K = 0.32;
  const DAMPING = 0.66;
  let bassAvg = 0;
  let hitScale = 1;
  let started = false;
  const particles = [];
  const MAX_PARTICLES = 90;

  function sizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
  }

  function initAnalyser(){
    if(audioCtx) return;
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sourceNode = audioCtx.createMediaElementSource(track);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 128;
      analyser.smoothingTimeConstant = 0.25;
      sourceNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
    }catch(e){ audioCtx = null; }
  }

  function drawBars(){
    rafId = requestAnimationFrame(drawBars);
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.width, h = canvas.height;
    vizCtx.clearRect(0,0,w,h);

    vizCtx.shadowBlur = 0;
    vizCtx.fillStyle = 'rgba(255,255,255,0.4)';
    const dotGap = 6 * dpr;
    for(let x=0.5*dpr; x<w; x+=dotGap){
      vizCtx.fillRect(x, 0, 1.2*dpr, 1.2*dpr);
    }

    const barW = w / BAR_COUNT;
    const targets = new Array(BAR_COUNT);
    if(analyser){
      analyser.getByteFrequencyData(dataArray);

      let totalSum = 0;
      for(let k=0;k<dataArray.length;k++){ totalSum += dataArray[k]; }
      const totalAvg = totalSum / dataArray.length;
      if(!started && totalAvg > 16){ started = true; }

      /* arranque de la musiquita bloqueado hasta que inicie la pagina */
      if(started){
        const bassBins = Math.min(4, dataArray.length);
        let bassSum = 0;
        for(let k=0;k<bassBins;k++){ bassSum += dataArray[k]; }
        const bass = bassSum / bassBins;
        if(bass > bassAvg*1.3 && bass > 24){
          hitScale = 1.3;
          
          const spikes = 1 + (Math.random() < 0.4 ? 1 : 0);
          for(let s=0; s<spikes; s++){
            const idx = Math.floor(Math.random()*BAR_COUNT);
            spikeBoost[idx] = h * (1.05 + Math.random()*0.5);
          }
        }
        bassAvg = bassAvg*0.9 + bass*0.1;
        hitScale += (1 - hitScale) * 0.12;
      }

      const step = Math.max(1, Math.floor(dataArray.length / BAR_COUNT));
      for(let i=0;i<BAR_COUNT;i++){
        if(!started){
          targets[i] = h*0.02;
          continue;
        }
        let sum=0, cnt=0;
        for(let j=i*step;j<i*step+step && j<dataArray.length;j++){ sum+=dataArray[j]; cnt++; }
        const v = cnt ? sum/cnt : 0;

        barPeak[i] = Math.max(v, barPeak[i]*0.985);
        const norm = Math.min(1, v / Math.max(barPeak[i], 40));

        spikeBoost[i] *= 0.86;
        const base = norm * h * barCeil[i] * hitScale;
        targets[i] = Math.min(h, Math.max(h*0.02, Math.max(base, spikeBoost[i])));
      }
    } else {
      for(let i=0;i<BAR_COUNT;i++){ targets[i] = h*0.035; }
    }

    vizCtx.shadowColor = '#ff4b3f';
    vizCtx.shadowBlur = 4 * dpr;
    vizCtx.fillStyle = '#ff4b3f';
    for(let i=0;i<BAR_COUNT;i++){
      const dx = targets[i] - barHeights[i];
      barVel[i] = (barVel[i] + dx * SPRING_K) * DAMPING;
      barHeights[i] = Math.max(0, barHeights[i] + barVel[i]);
      const bh = barHeights[i];
      const bw = barW * 0.32;
      const x = i*barW + (barW-bw)/2 + barJitter[i]*barW*0.35;
      vizCtx.fillRect(x, 0, bw, bh);

      /* gotas de "sangresita" cayendo de la musiquita UwU */
      if(started && bh > h*0.16 && particles.length < MAX_PARTICLES && Math.random() < 0.055){
        particles.push({
          x: x + bw/2,
          y: bh,
          vy: 0.16*dpr,
          life: 1,
          size: (1.6 + Math.random()*1.6) * dpr
        });
      }
    }

    
    vizCtx.shadowColor = '#ff1f1f';
    vizCtx.shadowBlur = 3 * dpr;
    for(let p=particles.length-1; p>=0; p--){
      const drop = particles[p];
      drop.vy += 0.05 * dpr;
      drop.y += drop.vy;
      drop.life -= 0.007;
      if(drop.life <= 0 || drop.y > h*2.4){
        particles.splice(p,1);
        continue;
      }
      vizCtx.globalAlpha = Math.min(1, drop.life * 1.3);
      vizCtx.fillStyle = drop.life > 0.6 ? '#ff2f2f' : '#c81018';
      vizCtx.beginPath();
      vizCtx.ellipse(drop.x, drop.y, drop.size*0.55, drop.size*0.95, 0, 0, Math.PI*2);
      vizCtx.fill();
    }
    vizCtx.shadowBlur = 0;
    vizCtx.globalAlpha = 1;
  }

  function startViz(){
    sizeCanvas();
    initAnalyser();
    if(audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume(); }
    if(!rafId){ drawBars(); }
  }

  window.addEventListener('resize', sizeCanvas);

  const steamBtn = document.getElementById('steamBtn');

  const avatarRing = document.querySelector('.avatar-ring');
  let dripActive = false;
  let dripCleanupTimeout;
  function startDripSequence(){
    if(dripActive) return;
    dripActive = true;
    avatarRing.classList.add('dripping');
    clearTimeout(dripCleanupTimeout);
    dripCleanupTimeout = setTimeout(()=>{
      avatarRing.classList.remove('dripping');
      dripActive = false;
    }, 10200);
  }
  avatarRing.addEventListener('mouseenter', startDripSequence);
  avatarRing.addEventListener('touchstart', startDripSequence, { passive:true });

  const nameEl = document.querySelector('.name-wrap .name');
  let igniteTimeout;
  if(nameEl){
    nameEl.addEventListener('animationend', (e)=>{
      if(e.animationName === 'nameFlash'){
        nameEl.classList.add('ignited');
        clearTimeout(igniteTimeout);
        igniteTimeout = setTimeout(()=>{
          nameEl.classList.remove('ignited');
        }, 5000);
      }
    });
  }

  function enter(){
    entry.classList.add('hide');
    stage.classList.add('show');
    nowplaying.classList.add('show');
    steamBtn.classList.add('show');
    track.volume = 0.97;
    track.play().then(()=>{
      nowplaying.classList.add('playing');
      startViz();
    }).catch(()=>{});
    entry.removeEventListener('click', enter);
    entry.removeEventListener('keydown', enterKey);
  }
  function enterKey(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); enter(); }
  }
  entry.addEventListener('click', enter);
  entry.addEventListener('keydown', enterKey);

  function toggleAudio(){
    if(track.paused){
      track.play();
      nowplaying.classList.add('playing');
      startViz();
    } else {
      track.pause();
      nowplaying.classList.remove('playing');
    }
  }
  nowplaying.addEventListener('click', toggleAudio);
  nowplaying.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggleAudio(); }
  });
</script>
